name: cinema-hw5

x-kafka-env: &kafka-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms256m -Xmx256m

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.8.0
  restart: unless-stopped
  healthcheck:
    test: [CMD-SHELL, 'KAFKA_HEAP_OPTS="-Xms32m -Xmx128m" kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1']
    interval: 30s
    timeout: 15s
    retries: 8
    start_period: 40s

x-app: &app
  build: .
  image: cinema-hw5-app:local
  restart: unless-stopped
  environment: &app-env
    KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    SCHEMA_REGISTRY_URL: http://schema-registry:8081
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_USER: cinema
    CLICKHOUSE_PASSWORD: cinema_pass
    POSTGRES_DSN: postgresql://cinema:cinema_pass@postgres:5432/cinema
    S3_ENDPOINT_URL: http://minio:9000
    S3_ACCESS_KEY: minioadmin
    S3_SECRET_KEY: minioadmin123
  depends_on:
    init:
      condition: service_completed_successfully

services:
  kafka-1:
    <<: *kafka
    hostname: kafka-1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    volumes: [kafka-1-data:/var/lib/kafka/data]

  kafka-2:
    <<: *kafka
    hostname: kafka-2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes: [kafka-2-data:/var/lib/kafka/data]

  kafka-3:
    <<: *kafka
    hostname: kafka-3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
    volumes: [kafka-3-data:/var/lib/kafka/data]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    restart: unless-stopped
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx256m
    ports: ['127.0.0.1:8081:8081']
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8081/subjects]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:25.3.2.39
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema_pass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ['127.0.0.1:8123:8123']
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/config.xml:/etc/clickhouse-server/config.d/cinema.xml:ro
      - ./infra/clickhouse/users.xml:/etc/clickhouse-server/users.d/cinema.xml:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: [CMD, clickhouse-client, --user, cinema, --password, cinema_pass, --query, 'SELECT 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:17.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema_pass
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U cinema -d cinema]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    build: ./infra/minio
    image: cinema-hw5-minio:local
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:9000/minio/health/live', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 10

  init:
    <<: *app
    restart: 'no'
    command: python -m app.bootstrap
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
      schema-registry: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: [CMD, test, -f, /tmp/initialized]
      interval: 5s
      timeout: 2s
      retries: 30

  producer:
    <<: *app
    ports: ['127.0.0.1:${PRODUCER_PORT:-8005}:8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=8)"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 20s

  generator:
    <<: *app
    command: python -m app.producer.generator
    environment:
      <<: *app-env
      GENERATOR_ENABLED: ${GENERATOR_ENABLED:-true}
      SEED_HISTORY: ${SEED_HISTORY:-true}
      GENERATOR_INTERVAL_SECONDS: ${GENERATOR_INTERVAL_SECONDS:-3}
    volumes: [generator-data:/data]
    healthcheck:
      test: [CMD, python, -c, "import time,pathlib; assert time.time()-pathlib.Path('/tmp/generator-heartbeat').stat().st_mtime < 120"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s

  aggregation:
    <<: *app
    command: uvicorn app.aggregation.main:app --host 0.0.0.0 --port 8000
    ports: ['127.0.0.1:${AGGREGATION_PORT:-8006}:8000']
    environment:
      <<: *app-env
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      AGGREGATION_INTERVAL_SECONDS: ${AGGREGATION_INTERVAL_SECONDS:-60}
      RECALCULATE_DAYS: ${RECALCULATE_DAYS:-14}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=8)"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 20s

  grafana:
    build: ./infra/grafana
    image: cinema-hw5-grafana:local
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cinema.json
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://localhost:3000/api/health]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  tests:
    <<: *app
    profiles: [test]
    restart: 'no'
    command: pytest -q tests
    environment:
      <<: *app-env
      PRODUCER_URL: http://producer:8000
      AGGREGATION_URL: http://aggregation:8000
    depends_on:
      producer: {condition: service_healthy}
      aggregation: {condition: service_healthy}
      grafana: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import pytest']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  clickhouse-data:
  postgres-data:
  minio-data:
  grafana-data:
  generator-data:
